# @package _global_
# TBFM (Temporal Basis Function Model) configuration

tbfm:
  module:
    _target_: tbfm.tbfm.TBFM
    in_dim: ${latent_dim}  # By default TBFM lives in a latent space.
    runway: ${data.runway}
    num_bases: 100
    trial_len: ${data.y_len}
    latent_dim: 16  # This is basis generator latent dim
    basis_depth: 3
    covariate_dim: ${covariate_dim}
    zscore: false
    use_meta_learning: true
    proj_meta_dim: 32
    basis_residual_rank: ${meta.basis_residual_rank}
    residual_mlp_hidden: ${meta.residual_mlp_hidden}
    basis_gen_dropout: 0.3
    embed_dim_rest: 3
    embed_dim_stim: 15
    use_tanh_basis_weights: true
    use_basis_weight_row_norm: true

  sharing:
    shared: true

  dispatcher:
    _target_: tbfm.tbfm.SessionDispatcherTBFM

  # Learning parameters
  training:
    optim:
      # Per-parameter-set rates.  These are 20x the old values (4e-4 / 3e-3): with a shared
      # TBFM the optimizers used to be built once per session, so a 20-session run stepped
      # the shared parameters 20 times per iteration.  There is now one optimizer, and the
      # rate carries the old 20x factor.  Weight decay is unchanged (AdamW decays by lr*wd).
      lr_head: 8e-3
      lr_meta: 6e-2
      wd_head: 1e-4
      wd_meta: 1e-5
    lambda_fro: 75.0
    lambda_ortho: 0.05
